name: Sync upstream

on:
    workflow_dispatch:
    schedule:
        - cron: '*/30 * * * *'

permissions:
    contents: write
    issues: write

concurrency:
    group: upstream-sync-rsshub
    cancel-in-progress: false

env:
    TARGET_BRANCH: master
    UPSTREAM_REPOSITORY: DIYgod/RSSHub
    UPSTREAM_DOCKER_WORKFLOW: docker-release.yml

jobs:
    sync:
        name: Sync the latest upstream Docker release
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Check out maintained branch
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ env.TARGET_BRANCH }}
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Use Node.js 24
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '24'
                  cache: pnpm

            - name: Resolve latest successful upstream Docker release
              id: compare
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git" 2>/dev/null || true
                  git fetch upstream master --prune

                  release_json="$(gh api "repos/${UPSTREAM_REPOSITORY}/actions/workflows/${UPSTREAM_DOCKER_WORKFLOW}/runs?branch=master&status=success&per_page=1" --jq '.workflow_runs[0]')"
                  if [ -z "$release_json" ] || [ "$release_json" = "null" ]; then
                    echo "status=no_release" >> "$GITHUB_OUTPUT"
                    echo "No successful upstream Docker release has been published yet."
                    exit 0
                  fi

                  release_run_id="$(jq -r '.id' <<< "$release_json")"
                  release_run_url="$(jq -r '.html_url' <<< "$release_json")"
                  upstream_sha="$(jq -r '.head_sha' <<< "$release_json")"
                  if ! git cat-file -e "${upstream_sha}^{commit}"; then
                    echo "The upstream Docker release commit is not reachable from upstream/master: ${upstream_sha}" >&2
                    exit 1
                  fi
                  upstream_title="$(git show -s --format=%s "$upstream_sha")"
                  {
                    echo "upstream_sha=${upstream_sha}"
                    echo "release_run_id=${release_run_id}"
                    echo "release_run_url=${release_run_url}"
                    echo "upstream_title<<SYNC_EOF"
                    echo "$upstream_title"
                    echo "SYNC_EOF"
                  } >> "$GITHUB_OUTPUT"
                  echo "Upstream Docker release run: ${release_run_url}"
                  echo "Upstream release commit: ${upstream_sha} (${upstream_title})"

                  if git merge-base --is-ancestor "$upstream_sha" HEAD; then
                    echo "status=already_current" >> "$GITHUB_OUTPUT"
                    echo "The maintained branch already contains the latest upstream Docker release."
                    exit 0
                  fi

                  candidate_branch="sync-check-${GITHUB_RUN_ID}"
                  git checkout -b "$candidate_branch"
                  if git merge --no-commit --no-ff "$upstream_sha"; then
                    echo "candidate_branch=${candidate_branch}" >> "$GITHUB_OUTPUT"
                    echo "status=clean" >> "$GITHUB_OUTPUT"
                    echo "The latest upstream Docker release merged without textual conflicts."
                    exit 0
                  fi

                  conflict_files="$(git diff --name-only --diff-filter=U | sort -u || true)"
                  if [ -z "$conflict_files" ]; then
                    conflict_files="(merge failed without a normal unmerged-file list; inspect the workflow log)"
                  fi
                  git merge --abort || git reset --hard HEAD

                  body_file="$(mktemp)"
                  {
                    echo "## Upstream Docker release merge conflict"
                    echo
                    echo "The latest successful upstream Docker release could not be merged. The maintained branch was not changed."
                    echo
                    echo "- Upstream Docker release run: ${release_run_url}"
                    echo "- Upstream commit: ${upstream_sha} (${upstream_title})"
                    echo "- **Conflicting files:**"
                    echo '```text'
                    echo "$conflict_files"
                    echo '```'
                    echo
                    echo "A clean Git merge is required before automated tests, container validation, and promotion can continue."
                  } > "$body_file"

                  existing="$(gh issue list --state open --search "[upstream-sync] Docker release ${upstream_sha:0:8} in:title" --json number --jq 'length')"
                  if [ "$existing" = "0" ]; then
                    gh issue create \
                      --title "[upstream-sync] Docker release merge conflict (${upstream_sha:0:8})" \
                      --body-file "$body_file" || true
                  fi
                  rm -f "$body_file"
                  echo "status=merge_conflict" >> "$GITHUB_OUTPUT"
                  exit 10

            - name: Stop when no new upstream Docker release exists
              if: steps.compare.outputs.status == 'no_release'
              run: echo "No upstream Docker release is available yet."

            - name: Stop when the branch is already current
              if: steps.compare.outputs.status == 'already_current'
              run: echo "The maintained branch already contains the latest upstream Docker release."

            - name: Install dependencies
              if: steps.compare.outputs.status == 'clean'
              run: pnpm install --frozen-lockfile

            - name: Rebuild dependency binaries
              if: steps.compare.outputs.status == 'clean'
              run: pnpm rb

            - name: Run typecheck
              if: steps.compare.outputs.status == 'clean'
              run: pnpm typecheck

            - name: Run route build
              if: steps.compare.outputs.status == 'clean'
              run: pnpm build

            - name: Validate the container build
              if: steps.compare.outputs.status == 'clean'
              run: docker build --build-arg PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 --tag rsshub:upstream-sync .

            - name: Promote the validated candidate
              if: steps.compare.outputs.status == 'clean'
              env:
                  CANDIDATE_BRANCH: ${{ steps.compare.outputs.candidate_branch }}
                  UPSTREAM_SHA: ${{ steps.compare.outputs.upstream_sha }}
                  UPSTREAM_TITLE: ${{ steps.compare.outputs.upstream_title }}
              run: |
                  set -euo pipefail
                  git commit -m "chore(sync): merge upstream Docker release (${UPSTREAM_SHA:0:8})"
                  git checkout "${TARGET_BRANCH}"
                  git merge --ff-only "${CANDIDATE_BRANCH}"
                  git push origin "${TARGET_BRANCH}"
                  echo "Promoted upstream Docker release ${UPSTREAM_SHA} (${UPSTREAM_TITLE}) to ${TARGET_BRANCH}."
