name: Sync upstream

on:
    workflow_dispatch:
    schedule:
        - cron: '17 3 * * *'

permissions:
    contents: write
    issues: write

concurrency:
    group: upstream-sync-rsshub
    cancel-in-progress: false

env:
    TARGET_BRANCH: master
    UPSTREAM_REPOSITORY: DIYgod/RSSHub

jobs:
    sync:
        name: Sync upstream with Git merge conflict detection
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Check out maintained branch
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ env.TARGET_BRANCH }}
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Use Node.js 24
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '24'
                  cache: pnpm

            - name: Merge upstream into candidate branch
              id: compare
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git" 2>/dev/null || true
                  git fetch upstream master --prune

                  upstream_sha="$(git rev-parse upstream/master)"
                  upstream_title="$(git log -1 --format=%s upstream/master)"
                  {
                    echo "upstream_sha=${upstream_sha}"
                    echo "upstream_title<<SYNC_EOF"
                    echo "$upstream_title"
                    echo "SYNC_EOF"
                  } >> "$GITHUB_OUTPUT"

                  if git merge-base --is-ancestor upstream/master HEAD; then
                    echo "status=already_current" >> "$GITHUB_OUTPUT"
                    echo "Upstream is already contained in ${TARGET_BRANCH}."
                    exit 0
                  fi

                  candidate_branch="sync-check-${GITHUB_RUN_ID}"
                  git checkout -b "$candidate_branch"
                  if git merge --no-commit --no-ff upstream/master; then
                    echo "candidate_branch=${candidate_branch}" >> "$GITHUB_OUTPUT"
                    echo "status=clean" >> "$GITHUB_OUTPUT"
                    echo "Upstream merge completed without textual conflicts."
                    exit 0
                  fi

                  conflict_files="$(git diff --name-only --diff-filter=U | sort -u || true)"
                  if [ -z "$conflict_files" ]; then
                    conflict_files="(merge failed without a normal unmerged-file list; inspect the workflow log)"
                  fi
                  git merge --abort || git reset --hard HEAD

                  body_file="$(mktemp)"
                  {
                    echo "## Upstream merge conflict"
                    echo
                    echo "The candidate merge of upstream ${UPSTREAM_REPOSITORY} conflicted. The maintained branch was not changed."
                    echo
                    echo "- Upstream commit: ${upstream_sha} (${upstream_title})"
                    echo "- **Conflicting files:**"
                    echo '```text'
                    echo "$conflict_files"
                    echo '```'
                    echo
                    echo "A clean Git merge is required before automated tests, container validation, and promotion can continue."
                    echo
                    echo "Actions run: https://github.com/${GITHUB_REPOSITORY}/actions"
                  } > "$body_file"

                  existing="$(gh issue list --state open --search "[upstream-sync] Merge conflict ${upstream_sha:0:8} in:title" --json number --jq 'length')"
                  if [ "$existing" = "0" ]; then
                    gh issue create \
                      --title "[upstream-sync] Merge conflict (${upstream_sha:0:8})" \
                      --body-file "$body_file" || true
                  fi
                  rm -f "$body_file"
                  echo "status=merge_conflict" >> "$GITHUB_OUTPUT"
                  exit 10

            - name: Install dependencies
              if: steps.compare.outputs.status == 'clean'
              run: pnpm install --frozen-lockfile

            - name: Rebuild dependency binaries
              if: steps.compare.outputs.status == 'clean'
              run: pnpm rb

            - name: Run typecheck
              if: steps.compare.outputs.status == 'clean'
              run: pnpm typecheck

            - name: Run route build
              if: steps.compare.outputs.status == 'clean'
              run: pnpm build

            - name: Validate the container build
              if: steps.compare.outputs.status == 'clean'
              run: docker build --build-arg PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 --tag rsshub:upstream-sync .

            - name: Promote the validated candidate
              if: steps.compare.outputs.status == 'clean'
              env:
                  CANDIDATE_BRANCH: ${{ steps.compare.outputs.candidate_branch }}
                  UPSTREAM_SHA: ${{ steps.compare.outputs.upstream_sha }}
                  UPSTREAM_TITLE: ${{ steps.compare.outputs.upstream_title }}
              run: |
                  set -euo pipefail
                  git commit -m "chore(sync): merge upstream master (${UPSTREAM_SHA:0:8})"
                  git checkout "${TARGET_BRANCH}"
                  git merge --ff-only "${CANDIDATE_BRANCH}"
                  git push origin "${TARGET_BRANCH}"
                  echo "Promoted upstream ${UPSTREAM_SHA} (${UPSTREAM_TITLE}) to ${TARGET_BRANCH}."
