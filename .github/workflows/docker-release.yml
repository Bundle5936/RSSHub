name: Docker Release

on:
    push:
        branches:
            - master
        paths:
            - '.github/workflows/docker-release.yml'
            - 'Dockerfile'
            - 'lib/**'
            - 'package.json'
            - 'patches/**'
            - 'pnpm-lock.yaml'
            - 'scripts/docker/**'
    workflow_dispatch:
        inputs:
            publish_production:
                description: Publish the production chromium-bundled tag (normally leave disabled for PR testing)
                required: false
                default: false
                type: boolean

permissions:
    contents: read

jobs:
    release:
        name: Build ${{ matrix.platform }} image
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(sync): merge upstream'))
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      runner: ubuntu-latest
                    - platform: linux/arm64
                      runner: ubuntu-24.04-arm
        permissions:
            contents: read
            packages: write
        steps:
            - name: Prepare
              id: prepare
              run: |
                  platform=${{ matrix.platform }}
                  echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
                  image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
                  echo "IMAGE_NAME=$image_name" >> "$GITHUB_ENV"
                  echo "image_name=$image_name" >> "$GITHUB_OUTPUT"

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - name: Log in to the GitHub Container registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ steps.prepare.outputs.image_name }}
                  tags: |
                      type=raw,value=chromium-bundled,enable=${{ github.event_name == 'push' || inputs.publish_production }}
                      type=raw,value=chromium-bundled-{{date 'YYYY-MM-DD'}},enable=${{ github.event_name == 'push' || inputs.publish_production }}
                      type=raw,value=manual-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' && !inputs.publish_production }}
                      type=sha,format=long,prefix=chromium-bundled-
                  flavor: latest=false

            - name: Build and push image by digest
              id: build
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  build-args: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=0
                  labels: ${{ steps.meta.outputs.labels }}
                  platforms: ${{ matrix.platform }}
                  cache-from: type=gha,scope=docker-release-${{ env.PLATFORM_PAIR }}
                  cache-to: type=gha,mode=max,scope=docker-release-${{ env.PLATFORM_PAIR }}
                  outputs: type=image,name=${{ steps.prepare.outputs.image_name }},compression=zstd,force-compression=true,push-by-digest=true,name-canonical=true,push=true

            - name: Export digest
              run: |
                  mkdir -p "${{ runner.temp }}/digests"
                  digest="${{ steps.build.outputs.digest }}"
                  touch "${{ runner.temp }}/digests/${digest#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: digests-${{ env.PLATFORM_PAIR }}
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

    merge:
        name: Publish multi-platform manifest
        runs-on: ubuntu-latest
        needs: release
        timeout-minutes: 10
        permissions:
            contents: read
            packages: write
        steps:
            - name: Prepare
              id: prepare
              run: |
                  image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
                  echo "IMAGE_NAME=$image_name" >> "$GITHUB_ENV"
                  echo "image_name=$image_name" >> "$GITHUB_OUTPUT"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - name: Log in to the GitHub Container registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Download digests
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  path: ${{ runner.temp }}/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ steps.prepare.outputs.image_name }}
                  tags: |
                      type=raw,value=chromium-bundled,enable=${{ github.event_name == 'push' || inputs.publish_production }}
                      type=raw,value=chromium-bundled-{{date 'YYYY-MM-DD'}},enable=${{ github.event_name == 'push' || inputs.publish_production }}
                      type=raw,value=manual-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' && !inputs.publish_production }}
                      type=sha,format=long,prefix=chromium-bundled-
                  flavor: latest=false

            - name: Create and push multi-platform manifest
              working-directory: ${{ runner.temp }}/digests
              run: |
                  docker buildx imagetools create \
                      $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                      $(printf '${{ steps.prepare.outputs.image_name }}@sha256:%s ' *)
